<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- title and font -->
    <title>Assignment 05 | GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- font awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- tailwind + daisyiu -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>   
</head>
<body>
    <section class="max-w-lg mx-auto mt-12 border border-[#E4E4E7] rounded-lg shadow-xl p-6 space-y-3">
        <!-- ?logo part -->
        <div class="logo mx-auto p-8">
           <img class="mx-auto mb-5" src="./assets/github-logo.png" alt="">
           <h2 class="font-bold text-2xl text-[#1F2937] text-center ">GitHub Issues Tracker</h2>
           <p class="text-[16px] text-[#64748B] text-center">Sign in to manage your issues</p>
        </div>

        <!-- form part -->
        <div class="card w-full max-w-xl mx-auto shrink-0 p-0">
          <div class="card-body">
           <fieldset class="fieldset">
              <label class="label text-[#1F2937] text-[16px] font-bold">Username</label>
              <input id="username-btn" type="email" class="input w-full text-[#64748B] text-[16px] rounded-lg" placeholder="Enter Username" />
              <p class="text-sm text-[#4A00FF]">Default: admin</p>

              <label class="label text-[#1F2937] text-[16px] font-bold">Password</label>
              <input id="pass-btn" type="password" class="input w-full text-[#64748B] text-[16px]  rounded-lg" placeholder="Enter Password" />
              <p class="text-sm text-[#4A00FF]">Default: admin123</p>
              <button id="signin" class="btn btn-primary mt-4">Signin</button>
           </fieldset>
          </div>
           <div class="divider">OR</div>
           <p class=" text-[#64748B] text-sm  rounded-lg text-center">Demo Credentials</p>
        </div> 

        <!-- text part -->
        <div class="bg-[#F8FAFC] text-center p-6">
          <h4 class="text-[16px]"><span class="font-bold text-[#1F2937]">Username:</span> <span class="text-[#64748B] ">admin</span> </h4>
          <h4 class="text-[16px]"><span class="font-bold text-[#1F2937]">Password:</span> <span class="text-[#64748B] ">admin123</span> </h4>
        </div>
    </section>
    <script src="./index.js"></script>
</body>
</html>
