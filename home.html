<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

        <!-- title and font -->
    <title>Home | GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- font awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- tailwind + daisyiu -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
   <header class="navbar bg-base-100 shadow-sm">
    <!-- left side -->
    <div class="flex justify-between w-11/12 mx-auto">
       <div class="flex items-center gap-3">
         <img class="w-10 h-10" src="./assets/github-logo.png" alt="">
         <h3 class="text-[#1F2937] font-bold text-xl">GitHub Issues Tracker</h3>
       </div>

   <!-- right side button -->
        <div class="flex gap-3">
          <input type="text" placeholder="Search issues" class="input input-bordered w-24 md:w-auto" />
          <button class="btn btn-primary"><i class="fa-solid fa-plus"></i> New issues</button>
        </div>
    </div>  
   </header>

   <main class="pt-[60px] bg-[#f8fafc] space-y-3">
    <!-- part1 -->
      <section class="flex gap-3 w-[70%] mx-auto bg-white p-6 rounded-lg border border-[#b7b7b850] shadow-md">
        <button class="btn btn-primary">All</button>
        <button class="btn">Open</button>
        <button class="btn">Closed</button>
      </section>
    <!-- part2 -->
      <section class="bg-white w-[70%] mx-auto p-6 rounded-lg border border-[#b7b7b850] shadow-lg">
          <div class="flex justify-between items-center">
            <!-- left part -->
              <div class="logo-issue flex items-center gap-4">
                  <img class="w-fit" src="./assets/Aperture.png" alt="">
                  <div class="logo-content">
                      <h3 class="text-[#1F2937] font-semibold text-xl">50 Issues</h3>
                      <p class="text-[#64748b] text-[16px]">Track and manage your project issues</p>
                   </div>
               </div>
            <!-- right part -->
               <div>
                  <p class="text-[16px] font-medium text-[#1F2937]"><i class="fa-solid fa-circle text-[#00A96E]"></i>  Open</p>
                  <p class="text-[16px] font-medium text-[#1F2937]"><i class="fa-solid fa-circle text-[#A855F7]"></i>  Closed</p>
               </div>
           </div>
      </section>
   </main>
    
</body>
</html>
